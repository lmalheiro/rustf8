# Dependabot version updates.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raise the minimum versions in Cargo.toml, not only the ones in Cargo.lock.
    versioning-strategy: "increase"
    # Wait a week before proposing a new release, so a broken or compromised one is likely yanked first.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # Compatible updates share one pull request. Major versions get their own, as they may need code changes.
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
